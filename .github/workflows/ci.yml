name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/ agent_engine/ audit_backend/

  typecheck-python:
    name: Type Check (Python)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install git+https://github.com/langchain-ai/deepagents.git#subdirectory=libs/deepagents langchain-openai tavily-python
      - run: mypy backend/

  lint-frontend:
    name: Lint & Type Check (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Main frontend
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
      - name: Audit frontend
        working-directory: audit-frontend
        run: |
          npm install
          npx tsc --noEmit

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: madf
          POSTGRES_PASSWORD: madf
          POSTGRES_DB: madf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: madf
      DB_PASSWORD: madf
      DB_NAME: madf
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret
      LLM_API_KEY: sk-test
      LLM_MODEL: gpt-4o
      TAVILY_API_KEY: tvly-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install git+https://github.com/langchain-ai/deepagents.git#subdirectory=libs/deepagents langchain-openai tavily-python
      - run: |
          python -c "import psycopg2; c=psycopg2.connect('dbname=madf user=madf password=madf host=localhost'); c.autocommit=True; c.cursor().execute('CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\"'); c.close()"
      - run: alembic upgrade head
      - run: pytest tests/ -v --tb=short --timeout=60 -k "not (test_create_and_list_characters or test_create_and_get_discussion)" --ignore=tests/ui_test.py --ignore=tests/ui_core_flow_test.py --ignore=tests/test_admin_api.py --ignore=tests/test_roundtable_agent.py --ignore=tests/test_discussion_e2e.py

  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Main frontend tests
        working-directory: frontend
        run: |
          npm install
          npm run test -- --reporter=verbose

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-python, typecheck-python, lint-frontend, test-python]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build --no-cache
