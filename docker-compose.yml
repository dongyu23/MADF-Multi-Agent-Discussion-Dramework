version: '3.8'

services:
  madf:
    build:
      context: .
      dockerfile: Dockerfile
    image: madf:latest
    container_name: madf-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=file:/app/data/madf.db
    env_file:
      - .env
    volumes:
      - madf_data:/app/data
    restart: always

volumes:
  madf_data:
