version: '3.8'

services:
  madf:
    build:
      context: .
      dockerfile: Dockerfile
    image: madf:latest
    container_name: madf-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=file:/app/data/madf.db
      - REDIS_URL=redis://localhost:6379/0
      - PYTHONPATH=/app
    env_file:
      - .env
    volumes:
      - madf_data:/app/data
      - madf_db:/app/madf.db
    restart: always
    command: /app/start.sh

volumes:
  madf_data:
  madf_db:
