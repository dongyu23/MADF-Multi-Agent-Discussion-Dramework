services:
  postgres:
    image: postgres:16-alpine
    container_name: madf-postgres
    environment:
      POSTGRES_USER: madf
      POSTGRES_PASSWORD: madf
      POSTGRES_DB: madf
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madf"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: madf-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: madf-backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=madf
      - DB_PASSWORD=madf
      - DB_NAME=madf
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - skills_data:/app/skills

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: madf-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
  skills_data:
