[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "agent_engine*", "audit_backend*"]

[project]
name = "madf"
version = "0.1.0"
description = "Multi-Agent Discussion Framework - Enterprise roundtable discussion platform powered by Deep Agents"
requires-python = ">=3.12"
readme = "AGENTS.md"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "bcrypt<5",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    "ruff>=0.11.0",
    "mypy>=1.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/alembic/*", "*/tests/*"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long handled by formatter
    "E402",   # lazy imports inside functions (Redis, circular-import avoidance)
    "B008",   # FastAPI Depends() in function defaults
    "B904",   # raise without from in except blocks
    "RUF001", # Chinese full-width punctuation
    "RUF002",
    "RUF003",
    "RUF006", # fire-and-forget create_task()
    "RUF012", # mutable class attribute
    "SIM105", # try-except-pass → contextlib.suppress (style)
    "F821",   # undefined name (lazy imports)
    "F401",   # unused import (init re-exports, intentional)
    "E712",   # == True in SQLAlchemy column comparisons
    "E741",   # ambiguous variable name l
    "RUF046", # int() cast of int (nuwa_source)
    "SIM108", # if-else → ternary (style)
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "agent_engine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = [
    "agent_engine/",
    "backend/alembic/",
    "tests/",
]

[[tool.mypy.overrides]]
module = "agent_engine.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "agent_engine"
follow_imports = "skip"
